apiVersion: cube-agent/v1
kind: Plugin
metadata:
  name: sales_with_refund
  version: 0.3.0
  description: HB POS v10 销售流水 (基于 siss_saleflow view) 含退货标记 + branch + 商品主表
  datasource: hbpos
  owner: collect-ai

# 设计: 2026-09-09 W1.2, 2026-09-10 集成阶段改用 siss_saleflow 主表
# 业务: 给 collect-ai freshcheck 的 Step 2 退货回冲用
#   含 sell_way (A=正/B=退) + ret_qnty 退货标记
#
# 集成发现 (2026-09-10):
#   - siss_saleflow view 实际只 5 列 (item_no, sale_price, sale_qnty, oper_date, sell_way)
#   - sale_money/in_price/branch_no 不在 view, 需 LEFT JOIN t_rm_saleflow
#   - t_rm_saleflow 有 ret_qnty (退货数量, 正单 = sale_qnty, 退单 = -ret_qnty)
#   - voucher_no/origin_flow_id 不存在 (W1.2 spec 错误, 已移除)
# 性能: 1 年数据约 318 万行 (view) + LEFT JOIN t_rm_saleflow (按 item_no+oper_date+sale_qnty 对齐, 慢)
# 维护: agent 自动热加载

# ============================================================
spec:
  cubes:
    - name: sales_with_refund
      # denormalized: siss_saleflow (5 列全集) + LEFT JOIN t_rm_saleflow (拿 branch + cost)
      # 退货标记 (双重保险):
      #   - sell_way IN ('B','T','R') → 退单
      #   - ret_qnty > 0 → 也是退单 (t_rm_saleflow 字段, 思迅约定)
      sql: |
        SELECT
          -- 2026-09-10 集成 A 优化: 彻底简化 SQL (原 30s+ timeout)
          --   去掉 ROW_NUMBER() OVER (3.2M 行排序超时)
          --   去掉 LEFT JOIN t_bd_item_info + t_bd_item_cls (collect-ai freshcheck 不需要 item_name/clsno/clsname/main_supcust)
          --   简化派生列: 只保留净额 sale_qnty + sale_money (cube 端 sum 自动抵消退货)
          --   保留 t_rm_saleflow LEFT JOIN 拿 branch + sale_money + in_price (净销售 + 毛利需要)
          RTRIM(si.item_no)         AS item_no,
          si.sale_price,
          -- 净额 sale_qnty (退货行转负)
          CASE WHEN si.sell_way IN ('B','T','R') OR ISNULL(s.ret_qnty, 0) > 0
               THEN -si.sale_qnty
               ELSE si.sale_qnty
          END AS sale_qnty,
          si.oper_date,
          RTRIM(si.sell_way)        AS sell_way,
          RTRIM(s.branch_no)        AS branch_no,
          -- 净额 sale_money
          CASE WHEN si.sell_way IN ('B','T','R') OR ISNULL(s.ret_qnty, 0) > 0
               THEN -ISNULL(s.sale_money, si.sale_price * si.sale_qnty)
               ELSE ISNULL(s.sale_money, si.sale_price * si.sale_qnty)
          END AS sale_money,
          ISNULL(s.in_price, 0)     AS in_price,
          ISNULL(s.in_price, 0) * (CASE WHEN si.sell_way IN ('B','T','R') OR ISNULL(s.ret_qnty, 0) > 0
                                        THEN -si.sale_qnty ELSE si.sale_qnty END) AS total_cost,
          -- 简化: gross_profit = sale_money(净额) - in_price * sale_qnty(净额) (SQL Server 优化器能识别)
          ISNULL(s.sale_money, si.sale_price * si.sale_qnty)
              - ISNULL(s.in_price, 0) * si.sale_qnty
              + CASE WHEN si.sell_way IN ('B','T','R') OR ISNULL(s.ret_qnty, 0) > 0
                     THEN -2 * ISNULL(s.sale_money, si.sale_price * si.sale_qnty)
                          + 2 * ISNULL(s.in_price, 0) * si.sale_qnty
                     ELSE 0 END AS gross_profit
        FROM dbo.siss_saleflow si
        LEFT JOIN dbo.t_rm_saleflow s
          ON RTRIM(si.item_no)  = RTRIM(s.item_no)
          AND si.oper_date      = s.oper_date
          AND si.sale_qnty      = s.sale_qnty
        WHERE si.oper_date >= DATEADD(YEAR, -1, GETDATE())
      description: 销售流水 (基于 siss_saleflow view + t_rm_saleflow LEFT JOIN, sale_qnty/sale_money 净额化)。
      primary_key: item_no  # 2026-09-10: 改用 item_no 当 PK (row_id 已删, siss_saleflow view 3.2M 行 ROW_NUMBER 30s+ timeout)
      measures:
        - name: count
          type: count
          description: 销售笔数 (含退货)
        - name: total_qnty
          type: sum
          sql: sale_qnty
          description: 总销量 (退货为负, sum 自动抵消)
        - name: total_revenue
          type: sum
          sql: sale_money
          description: 总销售额
        - name: total_cost
          type: sum
          sql: total_cost
          description: 总成本 (进价 × 销量)
        - name: total_gross_profit
          type: sum
          sql: gross_profit
          description: 总毛利
        # 2026-09-10 集成 A 优化: 删 refund_qnty / refund_amt / normal_revenue measure
        #   原 measure SQL 是 CASE WHEN is_refund=1/0 表达式, cube-agent-server Col() 加 [] 当列名 → SQL Server 列名错
        #   净额化后 total_qnty / total_revenue 已经包含净额 (退货自动抵消), 不需要单独 measure
      dimensions:
        - name: oper_date
          sql: oper_date
          type: time
          description: 销售时间 (支持 dateRange + granularity)
        - name: sale_qnty
          sql: sale_qnty
          type: number
          description: 单笔销量 (明细行, collect-ai 按 item_no 聚合用)
        - name: sale_money
          sql: sale_money
          type: number
          description: 单笔销售额 (明细行)
        - name: sale_price
          sql: sale_price
          type: number
          description: 单笔单价 (明细行)
        - name: in_price
          sql: in_price
          type: number
          description: 单笔进价 (明细行)
        - name: total_cost
          sql: total_cost
          type: number
          description: 单笔成本 (明细行)
        - name: gross_profit
          sql: gross_profit
          type: number
          description: 单笔毛利 (明细行)
        - name: ret_qnty
          sql: ret_qnty
          type: number
          description: 退货数量 (明细行)
        - name: branch_no
          sql: branch_no
          type: string
          description: 门店号 (来自 t_rm_saleflow, LEFT JOIN 可能为空)
        - name: item_no
          sql: item_no
          type: string
        - name: sell_way
          sql: sell_way
          type: string
          description: 思迅 sell_way 原值 (A=正/B=退/T=其他)
      segments: []