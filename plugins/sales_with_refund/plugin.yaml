apiVersion: cube-agent/v1
kind: Plugin
metadata:
  name: sales_with_refund
  version: 0.3.0
  description: HB POS v10 销售流水 (基于 siss_saleflow view) 含退货标记 + branch + 商品主表
  datasource: hbpos
  owner: collect-ai

# 设计: 2026-09-09 W1.2, 2026-09-10 集成阶段改用 siss_saleflow 主表
# 业务: 给 collect-ai freshcheck 的 Step 2 退货回冲用
#   含 sell_way (A=正/B=退) + ret_qnty 退货标记
#
# 集成发现 (2026-09-10):
#   - siss_saleflow view 实际只 5 列 (item_no, sale_price, sale_qnty, oper_date, sell_way)
#   - sale_money/in_price/branch_no 不在 view, 需 LEFT JOIN t_rm_saleflow
#   - t_rm_saleflow 有 ret_qnty (退货数量, 正单 = sale_qnty, 退单 = -ret_qnty)
#   - voucher_no/origin_flow_id 不存在 (W1.2 spec 错误, 已移除)
# 性能: 1 年数据约 318 万行 (view) + LEFT JOIN t_rm_saleflow (按 item_no+oper_date+sale_qnty 对齐, 慢)
# 维护: agent 自动热加载

# ============================================================
spec:
  cubes:
    - name: sales_with_refund
      # denormalized: siss_saleflow (5 列全集) + LEFT JOIN t_rm_saleflow (拿 branch + cost)
      # 退货标记 (双重保险):
      #   - sell_way IN ('B','T','R') → 退单
      #   - ret_qnty > 0 → 也是退单 (t_rm_saleflow 字段, 思迅约定)
      sql: |
        SELECT
          -- row_id (伪 PK, view 无 PK, 用 ROW_NUMBER)
          ROW_NUMBER() OVER (ORDER BY si.oper_date, si.item_no, si.sell_way) AS row_id,
          -- 来自 siss_saleflow view (5 列全集)
          RTRIM(si.item_no)         AS item_no,
          si.sale_price,
          si.sale_qnty,
          si.oper_date,
          RTRIM(si.sell_way)        AS sell_way,
          -- LEFT JOIN t_rm_saleflow (1:1, 拿 branch + sale_money + in_price + ret_qnty)
          -- 组合键: item_no + oper_date + sale_qnty (view + 主表对齐)
          RTRIM(s.branch_no)        AS branch_no,
          ISNULL(s.sale_money, si.sale_price * si.sale_qnty) AS sale_money,
          ISNULL(s.in_price, 0)     AS in_price,
          ISNULL(s.in_price, 0) * si.sale_qnty AS total_cost,
          ISNULL(s.sale_money, si.sale_price * si.sale_qnty) - ISNULL(s.in_price, 0) * si.sale_qnty AS gross_profit,
          ISNULL(s.ret_qnty, 0)     AS ret_qnty,
          -- 派生: 退货标记 (双重判定: sell_way + ret_qnty)
          CASE WHEN si.sell_way IN ('B', 'T', 'R') OR ISNULL(s.ret_qnty, 0) > 0 THEN 1 ELSE 0 END AS is_refund
        FROM dbo.siss_saleflow si
        LEFT JOIN dbo.t_rm_saleflow s
          ON RTRIM(si.item_no)  = RTRIM(s.item_no)
          AND si.oper_date      = s.oper_date
          AND si.sale_qnty      = s.sale_qnty
        WHERE si.oper_date >= DATEADD(YEAR, -1, GETDATE())
      description: 销售流水全集(基于 siss_saleflow view),含退货标记 + branch + sale_money + in_price。
      primary_key: row_id
      measures:
        - name: count
          type: count
          description: 销售笔数 (含退货)
        - name: total_qnty
          type: sum
          sql: sale_qnty
          description: 总销量 (退货为负, sum 自动抵消)
        - name: total_revenue
          type: sum
          sql: sale_money
          description: 总销售额
        - name: total_cost
          type: sum
          sql: total_cost
          description: 总成本 (进价 × 销量)
        - name: total_gross_profit
          type: sum
          sql: gross_profit
          description: 总毛利
        - name: refund_qnty
          type: sum
          sql: CASE WHEN is_refund=1 THEN ABS(sale_qnty) ELSE 0 END
          description: 退货总量 (绝对值)
        - name: refund_amt
          type: sum
          sql: CASE WHEN is_refund=1 THEN ABS(sale_money) ELSE 0 END
          description: 退货总额 (绝对值)
        - name: normal_revenue
          type: sum
          sql: CASE WHEN is_refund=0 THEN sale_money ELSE 0 END
          description: 正常销售收入 (排除退货)
      dimensions:
        - name: row_id
          sql: row_id
          type: number
          primary_key: true
        - name: oper_date
          sql: oper_date
          type: time
          description: 销售时间 (支持 dateRange + granularity)
        - name: sale_qnty
          sql: sale_qnty
          type: number
          description: 单笔销量 (明细行, collect-ai 按 item_no 聚合用)
        - name: sale_money
          sql: sale_money
          type: number
          description: 单笔销售额 (明细行)
        - name: sale_price
          sql: sale_price
          type: number
          description: 单笔单价 (明细行)
        - name: in_price
          sql: in_price
          type: number
          description: 单笔进价 (明细行)
        - name: total_cost
          sql: total_cost
          type: number
          description: 单笔成本 (明细行)
        - name: gross_profit
          sql: gross_profit
          type: number
          description: 单笔毛利 (明细行)
        - name: ret_qnty
          sql: ret_qnty
          type: number
          description: 退货数量 (明细行)
        - name: branch_no
          sql: branch_no
          type: string
          description: 门店号 (来自 t_rm_saleflow, LEFT JOIN 可能为空)
        - name: item_no
          sql: item_no
          type: string
        - name: item_name
          sql: |
            (SELECT TOP 1 RTRIM(item_name) FROM dbo.t_bd_item_info WHERE item_no = si.item_no)
          type: string
          description: 商品名 (通过子查询拿, 避免 JOIN 大表)
        - name: item_clsno
          sql: |
            (SELECT TOP 1 RTRIM(item_clsno) FROM dbo.t_bd_item_info WHERE item_no = si.item_no)
          type: string
          description: 商品分类码
        - name: item_clsname
          sql: |
            (SELECT TOP 1 RTRIM(c.item_clsname)
             FROM dbo.t_bd_item_info i
             JOIN dbo.t_bd_item_cls c ON i.item_clsno = c.item_clsno
             WHERE i.item_no = si.item_no)
          type: string
          description: 商品分类名
        - name: main_supcust
          sql: |
            (SELECT TOP 1 RTRIM(main_supcust) FROM dbo.t_bd_item_info WHERE item_no = si.item_no)
          type: string
          description: 主供应商
        - name: is_refund
          sql: is_refund
          type: number
          description: "是否退货 (0=正/1=退, 双重判定 sell_way + ret_qnty)"
        - name: sell_way
          sql: sell_way
          type: string
          description: 思迅 sell_way 原值 (A=正/B=退/T=其他)
      segments: []