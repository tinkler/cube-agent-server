      segments:
        # 客户端 Query.Segments=["sup_only"] 引用 → pass3 自动加到 WHERE
        #   在 cube 内可重用 {CUBE} 占位符(运行时替换为 cube 实际名)
        # 重要: pass3 把 cube SQL 嵌为 subquery (FROM (cube.SQL) AS cube_name)
        #   外层 WHERE 只能引用 subquery 暴露的列名(裸名,不带 t./sup. 前缀)
        #   所以 supcust_flag 必须在 cube SQL SELECT 列表里暴露,segment 才能引用
        - name: sup_only
          sql: "RTRIM(ISNULL(supcust_flag, '')) = 'S'"
          description: 排除客户,只保留供应商 (supcust_flag='S' = Supplier, 'C' = Customer, 已 SQL 验证)
        # 后续可加更多 segment,例如:
        # - name: in_stock_only
        #   sql: "status = '1' AND display_flag = '1'"
