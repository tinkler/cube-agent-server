apiVersion: cube-agent/v1
kind: Plugin
metadata:
  name: t_bd_item_info
  version: 0.4.0
  description: 商品主数据表 + 库存快照 + 分类名(2026-09-01 加 stock_qty,2026-09-03 加 item_clsname + RTRIM 所有 CHAR 字段,跟 display_restock_window 对齐)
  datasource: hbpos
  owner: manual
  generated_by: skill
  tags: [ai-generated, stock]

spec:
  cubes:
    - name: t_bd_item_info
      # 数据治理层 (cube 自己维护):t_bd_item_info 跟 t_bd_supcust_info 的关系
      # SQL 显式列名,加 LEFT JOIN 取 sup_name → supplier_name
      #   业务层 (collect-ai) 只需要做"业务字段名 ↔ 物理字段名"映射
      #   不知道也不关心 join 怎么写
      #   关键过滤: 客户端通过 segments=["sup_only"] 启用"只供应商"过滤
      #     supcust_flag = '1' = 供应商(hbpos 约定,需 SQL 验证)
      #     supcust_flag = '2' = 客户(被 segment 排除,避免 by-brand / 列供应商 时混入客户)
      #     验证 SQL: SELECT supcust_flag, COUNT(*) FROM t_bd_supcust_info GROUP BY supcust_flag
      # 2026-09-01 加 stock_qty:
      #   标量子查询聚合 t_im_branch_stock.stock_qty(全门店 SUM) — 不展开行,
      #   item 行数不变(11W+),扫描依然快;SQL Server 2008 R2 兼容(子查询 + ISNULL)
      # 2026-09-03 加 item_clsname:
      #   LEFT JOIN t_bd_item_cls 取分类名,给 restock 收编用 (LoadItemDict)
      # 2026-09-03 加 RTRIM 所有 CHAR 字段:
      #   hbpos 表是 CHAR(n) 类型,SQL 没 RTRIM 会带 trailing spaces
      #   display_restock_window 早 RTRIM,导致两 cube item_no 编码不一致
      #   → restock.LoadItemDict 字典 key (t_bd_item_info.item_no) 跟 PG
      #     display_suggest.item_no (display_restock_window 写入) 对不上
      #   → clsno/clsname/unit 字段全空,前端"未分类"
      #   修复: 所有 CHAR 字段 RTRIM,跟 display_restock_window 行为一致
      sql: |
        SELECT
          RTRIM(t.item_no)            AS item_no,
          RTRIM(t.item_subno)         AS item_subno,
          t.item_name, t.item_subname,
          RTRIM(t.item_clsno)         AS item_clsno,
          RTRIM(t.item_brand)         AS item_brand,
          RTRIM(t.item_brandname)     AS item_brandname,
          RTRIM(t.unit_no)            AS unit_no,
          t.item_size, t.product_area,
          RTRIM(t.combine_sta)        AS combine_sta,
          RTRIM(t.status)             AS status,
          RTRIM(t.display_flag)       AS display_flag,
          RTRIM(t.other1)             AS other1,
          RTRIM(t.other2)             AS other2,
          RTRIM(t.other3)             AS other3,
          RTRIM(t.automin_flag)       AS automin_flag,
          RTRIM(t.en_dis)             AS en_dis,
          RTRIM(t.direct)             AS direct,
          RTRIM(t.change_price)       AS change_price,
          RTRIM(t.item_supcust)       AS item_supcust,
          RTRIM(t.main_supcust)       AS main_supcust,
          RTRIM(t.item_sup_flag)      AS item_sup_flag,
          t.item_stock, t.item_counter,
          t.build_date, t.modify_date, t.stop_date,
          RTRIM(t.abc)                AS abc,
          t.branch_price,
          RTRIM(t.item_rem)           AS item_rem,
          RTRIM(t.branch_no)          AS branch_no,
          RTRIM(t.cost_compute)       AS cost_compute,
          RTRIM(t.com_flag)           AS com_flag,
          RTRIM(t.vip_acc_flag)       AS vip_acc_flag,
          RTRIM(t.dpfm_type)          AS dpfm_type,
          RTRIM(t.build_man)          AS build_man,
          RTRIM(t.last_modi_man)      AS last_modi_man,
          RTRIM(t.om_rate_type)       AS om_rate_type,
          t.price, t.base_price, t.sale_price,
          t.num1, t.num2, t.num3,
          t.po_cycle, t.so_cycle,
          t.purchase_tax, t.sale_tax, t.purchase_spec, t.shipment_spec,
          t.lose_rate, t.sup_ly_rate, t.return_rate,
          t.vip_price, t.sale_min_price,
          t.base_price1, t.base_price2, t.base_price3, t.base_price4,
          t.vip_acc_num, t.trans_price,
          t.vip_price1, t.vip_price2,
          t.order_man_rate,
          RTRIM(ISNULL(sup.sup_name, '')) AS supplier_name,
          RTRIM(ISNULL(sup.supcust_flag, '')) AS supcust_flag,
          RTRIM(ISNULL(cls.item_clsname, '')) AS item_clsname,
          ISNULL((SELECT SUM(stock_qty) FROM t_im_branch_stock WHERE item_no = t.item_no), 0) AS stock_qty
        FROM t_bd_item_info t
        LEFT JOIN t_bd_supcust_info sup
          ON RTRIM(t.main_supcust) = RTRIM(sup.supcust_no)
        LEFT JOIN t_bd_item_cls cls
          ON RTRIM(t.item_clsno) = RTRIM(cls.item_clsno)
      description: 商品主数据表，存储商品的基本信息，如编号、名称、分类、品牌、单位等。
      primary_key: item_no
      measures:
